function auditDetail(e){
 const caseId=(e.detail.match(/CASE-00[123]/)||['CASE-001'])[0];
 const prefix=caseId+' · ';
 if(e.key==='auditInitial')return prefix+t('auditIngestDetail')+' · CVE-2021-41773';
 if(e.key==='pending')return prefix+'A2 · '+t('auditGateDetail');
 if(e.key==='auditEscalated')return prefix+'ESCALATE · C4 · inspect_service · '+t('auditTimeoutDetail');
 if(e.key==='auditApproved')return prefix+'customer-portal-prod-01 · '+t('auditApprovalDetail');
 if(e.key==='auditExecution')return prefix+t('auditRunDetail');
 if(e.key==='auditVerify')return prefix+t(e.detail.includes('patched version')?'checkVersion':e.detail.includes('vulnerability')?'checkVuln':'checkHealth')+' · '+t('checkPass');
 if(e.key==='auditResolved')return prefix+t('auditCloseDetail');
 if(e.key==='auditFailure')return prefix+t(e.detail.includes('interrupted')?'interrupted':'failText');
 if(e.key==='auditRejected'){
  const reason=e.detail.startsWith(prefix)&&e.detail.endsWith(' · no execution allowed')?e.detail.slice(prefix.length,-' · no execution allowed'.length):e.detail;
  return prefix+reason+' · '+t('auditRejectDetail');
 }
 if(e.key==='auditReopened')return prefix+t('auditReopenDetail');
 return e.detail;
}

function sidebar(){return `<aside class="sidebar"><div class="brand">${icon('shield','brand-mark')}<div><div class="brand-name">TRACE</div><div class="brand-sub">${t('brandSubtitle')}</div></div></div><div class="workspace"><span class="workspace-icon">T</span><div class="grow"><strong style="font-size:11px;color:#d2e2d4">${t('workspace')}</strong><div style="font-size:9px;color:#7f9b89">${t('teamWorkspace')}</div></div>${icon('chevron')}</div><div class="sidebar-label">${t('navigation')}</div><nav class="nav" aria-label="${t('navigation')}">${['overview','cases','assets','audit'].map(k=>`<button data-act="nav-${k}" class="${ui.page===k||ui.page==='detail'&&k==='cases'?'active':''}" ${ui.page===k?'aria-current="page"':''}>${icon(k)}${t(k)}${k==='cases'?'<span class="count">3</span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="lab-note"><div class="row">${icon('shield')}<strong style="font-size:11px;color:#d1e4bd">${t('safeLab')}</strong></div><p>${t('safeLabBody')}</p></div><div class="user"><span class="avatar">LO</span><div><strong>${t('operator')}</strong><div class="small">${t('operatorRole')}</div></div></div></div></aside>`;}
function topbar(){return `<header class="topbar"><div class="crumb"><span class="desktop-crumb">${t('workspace')} <span style="padding:0 12px;color:#bcc8b7">/</span></span><strong>${window.innerWidth<691?'TRACE':t(ui.page==='detail'?'cases':ui.page)}</strong></div><div class="topbar-tools">${badge(t('sandbox'),'green')}<select class="lang" id="language-select" aria-label="${t('language')}">${[['en','English'],['ms','Bahasa Melayu'],['zh','中文']].map(([code,label])=>`<option value="${code}" ${lang===code?'selected':''}>${label}</option>`).join('')}</select><button class="icon-btn" data-act="demo-toggle" title="${t('demoControls')}" aria-label="${t('demoControls')}" aria-expanded="${ui.demoOpen}">${icon('code')}</button><span class="top-avatar" aria-hidden="true">LO</span></div></header><div class="demo-bar ${ui.demoOpen?'open':''}"><span>${t('demoToolsNote')}</span><div class="between"><label for="verification-mode">${t('verificationMode')} <select id="verification-mode" ${model.case1==='running'?'disabled':''}><option value="pass" ${model.verificationMode==='pass'?'selected':''}>${t('passMode')}</option><option value="fail" ${model.verificationMode==='fail'?'selected':''}>${t('failMode')}</option></select></label>${btn(t('resetDemo'),'reset','secondary','refresh')}</div></div>`;}
function mobileNav(){return `<nav class="mobile-nav" aria-label="${t('navigation')}">${['overview','cases','assets','audit'].map(k=>`<button data-act="nav-${k}" class="${ui.page===k||ui.page==='detail'&&k==='cases'?'active':''}" ${ui.page===k?'aria-current="page"':''}>${icon(k)}<span>${t(k)}</span></button>`).join('')}</nav>`;}
function footer(){return `<footer class="bottom-strip"><span class="row">${icon('info')}${t('demoFooter')}</span><span>${t('footerRight')}</span></footer>`;}
function casesTable(cases){if(!cases.length)return `<div class="card empty">${t('noResults')}</div>`;return `<div class="card table-wrap"><table class="case-table"><thead><tr><th>${t('finding')}</th><th>${t('priority')}</th><th>${t('findingStatus')}</th><th class="confidence-col">${t('confidence')}</th><th><span class="small">${t('detail')}</span></th></tr></thead><tbody>${cases.map(c=>`<tr><td class="name-cell"><div class="case-name"><span class="case-symbol">${icon(c.id===3?'review':'assets')}</span><div class="grow"><button class="case-open" data-act="case-${c.id}">${c.name}</button><span class="asset-id mono">${c.asset}</span></div></div></td><td class="priority-cell">${priorityFor(c)}</td><td class="status-cell">${statusFor(c)}</td><td class="confidence confidence-col">${t(c.confidence==='C0'?'c0':'c4')}</td><td class="arrow-cell"><button class="icon-btn" data-act="case-${c.id}" aria-label="${t('caseDetails')}: ${c.asset}">${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div>`;}
function overview(){const c=dataCases()[0],s=model.case1;const heroKey={pending:'hero',resolved:'heroResolved',rejected:'heroRejected',failed:'heroFailed',running:'heroRunning'}[s];return `<div class="page-head between"><div><div class="head-kicker"><i class="dot"></i>${t('track')}</div><h1>${t('headline')}</h1><p>${t('subtitle')}</p></div>${btn('<span class="head-action-label">'+t('allCases')+'</span>','nav-cases','secondary','arrow')}</div><section class="stats" aria-label="${t('currentState')}">${[['awaiting',s==='pending'?1:0,'stat1','lock'],['needsReview',s==='failed'||s==='rejected'?2:1,'stat2','review'],['notAffected',1,'stat3','shield'],['resolved',s==='resolved'?1:0,'stat4','check']].map((v,i)=>`<div class="stat"><div class="stat-head"><span>${t(v[0])}</span>${icon(v[3])}</div><div class="stat-number" style="${i===0&&s==='pending'?'color:var(--amber)':i===2||i===3?'color:var(--green)':''}">${v[1]}</div><div class="stat-foot">${t(v[2])}</div></div>`).join('')}</section><div class="overview-grid"><section class="card decision-card has-shield"><div class="decision-top">${icon(s==='resolved'?'check':'lock')}<span>${t('nextDecision')}</span><span class="mini-number">CASE-001</span></div>${icon('shield','shield-art')}<h2>${t(heroKey)}</h2><p>${t(heroKey+'Desc')}</p><div class="hero-status">${badge(s==='resolved'?t('checked'):t('confirmed'),s==='resolved'?'green':'red')}<span class="badge">P0</span><span class="badge">C0</span><span class="badge">A2</span></div><div class="hero-actions">${btn(t(s==='pending'?'reviewAction':'caseDetails'),'case-1','primary','arrow')}${btn(t('viewEvidence'),'evidence-1','secondary')}</div><div class="decision-sub">${icon('shield')}${t('protected')}</div></section><section class="card feed"><div class="section-top"><h2>${t('agentActivity')}</h2><span class="small muted">${t('localRun')}</span></div>${[['terminal','feedVersion','feedVersionDesc','09:41:09'],['shield','feedNegative','feedNegativeDesc','09:41:15'],['review','feedEscalate','feedEscalateDesc','09:41:20']].map(v=>`<div class="feed-item"><span class="feed-icon">${icon(v[0])}</span><div class="grow"><strong>${t(v[1])}</strong><p>${t(v[2])}</p><time>${v[3]} · ${t('agent')}</time></div></div>`).join('')}<div style="margin-top:20px">${btn(t('decisionLog'),'trace-1','ghost','arrow')}</div></section></div><section class="queue"><div class="section-top"><h2>${t('queue')}</h2><button class="inline-link" data-act="nav-cases">${t('viewQueue')}${icon('arrow')}</button></div>${casesTable(dataCases())}</section>${footer()}`;}
function casesPage(){let cases=dataCases();if(ui.filter==='action')cases=cases.filter(c=>c.id===3||c.id===1&&c.state!=='resolved');if(ui.filter==='closed')cases=cases.filter(c=>c.id===2||c.state==='resolved');if(ui.search)cases=cases.filter(c=>(c.cve+' '+c.name+' '+c.asset+' CASE-00'+c.id).toLowerCase().includes(ui.search.toLowerCase()));return `<div class="page-head"><div class="head-kicker">${t('track')}</div><h1>${t('casePageTitle')}</h1><p>${t('casePageDesc')}</p></div><div class="search-row"><label class="searchbox">${icon('search')}<input id="case-search" aria-label="${t('search')}" placeholder="${t('search')}" value="${escape(ui.search)}" autocomplete="off"></label><div class="segments" aria-label="${t('cases')}">${[['all','all'],['action','actionNeeded'],['closed','closed']].map(v=>`<button data-act="filter-${v[0]}" class="${ui.filter===v[0]?'active':''}" aria-pressed="${ui.filter===v[0]}">${t(v[1])}</button>`).join('')}</div></div>${casesTable(cases)}<div class="support-banner">${icon('info')}<span>${t('schema')}</span></div>${footer()}`;}

const decisionData={
 1:[['01','Scanner input','扫描器输入','A scanner report opens the case. Severity is an input, not the final decision.','扫描器报告建立案件。严重性只是输入，不直接决定是否修复。','Initial finding','CASE-001'],['02','Resolve version uncertainty','核实版本不确定性','The reported version may be stale. The agent selects runtime inspection before accepting the finding.','扫描版本可能过期，因此先选择运行时检查，再判断漏洞是否适用。','inspect_service','E-101'],['03','Fill the business context','补齐业务上下文','A confirmed affected version still needs exposure and criticality context to set urgency.','确认版本受影响后，还需知道暴露程度和业务重要性，才能决定紧急度。','get_asset_context','E-102'],['04','Check real-world applicability','核实情报与适用范围','The agent checks known exploitation and vendor guidance, then uses local validation inside the approved lab.','核对利用情报与厂商公告，然后在已授权实验室内进行本地验证。','lookup_kev · fetch_vendor_advisory · validate_vulnerability','E-103–E-105'],['05','Assess, then request approval','评估后请求批准','Evidence supports CONFIRMED_VULNERABLE · P0 · C0. The proposed A2 action stops at the human approval gate.','证据支持 CONFIRMED_VULNERABLE · P0 · C0。建议操作为 A2，必须停在人工审批门禁。','ASSESS → human approval','E-101–E-106']],
 2:[['01','Check the scanner’s assumption','核查扫描器的假设','The agent chooses a runtime check to confirm the scanner-reported version.','选择运行时检查，核实扫描器报告的版本。','inspect_service','E-201'],['02','Compare vendor applicability','对比厂商适用范围','The observed runtime is outside this CVE’s affected version. Further validation is unnecessary for this case.','实际运行版本不受此 CVE 影响，本案无需继续验证。','fetch_vendor_advisory','E-202'],['03','Stop without a change','停止，不执行变更','The result is NOT_AFFECTED · P5 · C0. No remediation or approval is requested.','结果为 NOT_AFFECTED · P5 · C0。不提出修复，也不请求批准。','ASSESS → STOP','E-201–E-202']],

function traceView(id){return `<div class="support-banner" style="margin:0 0 20px">${icon('branch')}<span>${pair('Sample decision summaries show the evidence gap, selected tool and stop condition. A real agent must produce these events from live tool results.','样例决策摘要展示证据缺口、工具选择与停止条件。真实智能体应依据实际工具结果产生这些记录。')}</span></div><div class="trace-list">${decisionData[id].map(s=>`<article class="trace-step"><div class="trace-icon">${s[0]}</div><div class="trace-copy"><strong>${pair(s[1],s[2])}</strong><p>${pair(s[3],s[4])}</p><span class="tool-label">${pair(s[5],({'Initial finding':'初始发现','ASSESS → human approval':'评估 → 人工批准','ASSESS → STOP':'评估 → 停止','ESCALATE → human review':'转交 → 人工复核'})[s[5]]||s[5])}</span><span class="evidence-pill">${s[6]}</span></div></article>`).join('')}</div>${id===1&&model.case1!=='pending'?`<div class="status-callout ${model.case1==='resolved'?'green':model.case1==='failed'?'red':''}">${statusFor(dataCases()[0])}<p style="margin-top:10px">${model.case1==='resolved'?t('passText'):model.case1==='failed'?t(model.failureReason==='interrupted'?'interrupted':'failText'):model.case1==='rejected'?t('rejectText'):t('heroRunningDesc')}</p></div>`:''}`;}
function assessmentView(c){const id=c.id;return `<article class="card pad"><div class="section-top"><h2>${t('assessmentSummary')}</h2><span class="small mono muted">CASE-00${id}</span></div><div class="explanation ${id===3?'warn':''}">${id===1?pair('The approved lab portal runs Apache 2.4.49. Version evidence, vendor applicability and local validation support a real finding. Exposure and known exploitation elsewhere support urgent remediation.','已授权实验门户运行 Apache 2.4.49。版本信息、厂商适用范围及本地验证支持漏洞存在。网络暴露和其他环境的利用记录支持优先处理。'):t(id===2?'negativeDesc':'reviewDesc')}</div><dl class="facts">${[[t('factsAsset'),c.asset,''],[t('factsVersion'),id===1?(model.case1==='resolved'?pair('Team-approved patched image (demo)','团队审核通过的修补镜像（演示）'):'Apache 2.4.49'):id===2?'Apache 2.4.51':pair('Unknown — inspection timed out','未知 — 检查超时'),'E-'+id+'01'],[t('factsExposure'),id===3?pair('Not verified','尚未核实'):t('labExposure'),id===1?'E-102':''],[t('factsContext'),id===1?t('critical'):id===2?pair('Order service (demo metadata)','订单服务（演示元数据）'):pair('Stale inventory — review required','清单过期 — 需要复核'),id===1?'E-102':''],[t('factsAffected'),id===1?t('affectedResult'):id===2?t('notAffected'):pair('Insufficient evidence','证据不足'),id===1?'E-104 · E-105':id===2?'E-202':'E-301'],[t('factsExploitation'),id===1?t('kevKnown'):pair('Not required for this assessment','本次评估无需此项'),id===1?'E-103':'']].map(v=>`<div><dt>${v[0]}</dt><dd>${v[1]}</dd>${v[2]?`<div class="fact-links">${v[2]}</div>`:''}</div>`).join('')}</dl><div class="evidence-summary">${icon(id===3?'review':'shield')}<div><p>${id===1?t('supportingEvidence')+' · 6':id===2?t('negativeStopped'):t('noChanges')}</p><small>${id===1?'E-101 → E-106':id===2?'E-201 · E-202':'E-301 · E-302'}</small></div></div>${btn(t('viewEvidence'),'evidence-'+id,'ghost','arrow')}</article><div class="wide-card card"><div class="mini-workflow">${[t('evidence'),t('assessment'),id===2?t('notAffected'):id===3?t('reviewOnly'):t('awaiting'),id===2?t('noChanges'):id===3?t('noChanges'):t('verification')].map((s,i)=>(i?icon('chevron'):'')+`<span>${s}</span>`).join('')}</div><p class="small muted" style="margin-top:13px;line-height:1.8">${id===1?t('caseScope'):id===2?t('negativeActionDesc'):t('reviewNextText')}</p></div>${id===3&&model.notes.length?`<article class="card pad" style="margin-top:18px"><h3>${t('noteLabel')}</h3>${model.notes.map(n=>`<p class="small muted" style="margin-top:10px">${escape(n)}</p>`).join('')}</article>`:''}`;}
function actionPanel(c){if(c.id!==1)return `<aside class="card action-card"><div class="action-head">${icon(c.id===2?'shield':'review')}${t(c.id===2?'negativeActionTitle':'needsReview')}</div><div class="action-body">${badge(t(c.id===2?'notAffected':'evidenceIncomplete'),c.id===2?'green':'amber')}<h3 style="margin-top:16px">${t(c.id===2?'negativeActionTitle':'reviewActionTitle')}</h3><p>${t(c.id===2?'negativeActionDesc':'reviewActionDesc')}</p><div class="info-box">${t(c.id===2?'negativeStopped':'reviewNextText')}</div><div class="action-footer">${btn(t(c.id===2?'viewTrace':'escalateButton'),c.id===2?'trace-2':'note-modal',c.id===2?'secondary':'primary',c.id===2?'branch':'audit')}</div></div></aside>`;
 const s=model.case1;if(s==='running'||s==='resolved'||s==='failed')return executionPanel();if(s==='rejected')return `<aside class="card action-card"><div class="action-head">${icon('lock')}${t('currentState')}</div><div class="action-body">${badge(t('rejected'),'gray')}<h3 style="margin-top:16px">${t('heroRejected').replace('<br>',' ')}</h3><p>${t('rejectText')}</p><div class="info-box"><strong>${t('reason')}</strong><br>${escape(model.rejectReason)}</div><div class="action-footer">${btn(t('newProposal'),'new-review','secondary','refresh')}<p class="gate-note">${t('gate')}</p></div></div></aside>`;
 return `<aside class="card action-card"><div class="action-head">${icon('tool')}${t('proposedAction')}<span class="badge amber" style="margin-left:auto;padding:4px 7px">A2</span></div><div class="action-body"><h3>${t('patchTitle')}</h3><p>${t('patchDesc')}</p><div class="action-details">${[['assets','scope','scopeText'],['clock','impact','impactText'],['refresh','rollback','rollbackText'],['shield','verification','verificationText']].map(v=>`<div class="item">${icon(v[0])}<div><strong>${t(v[1])}</strong>${t(v[2])}</div></div>`).join('')}</div><div class="action-footer">${btn(t('approve'),'approve-modal','primary','check')}${btn(t('reject'),'reject-modal','secondary')}<p class="gate-note">${icon('lock')} ${t('gate')}</p></div></div></aside>`;}
function executionPanel(){const s=model.case1,step=model.step,keys=['executeStep','checkVersion','checkVuln','checkHealth'];return `<aside class="card action-card"><div class="action-head">${icon(s==='running'?'refresh':s==='resolved'?'shield':'alert',s==='running'?'spinner':'')}${t('verificationProgress')}</div><div class="action-body">${statusFor(dataCases()[0])}<div class="progress-line"><span style="width:${step*25}%"></span></div><div class="step-state">${keys.map((k,i)=>{const fail=s==='failed'&&i===(model.failureReason==='interrupted'?Math.max(0,step-1):2),done=i<step&&!fail;return `<div class="row ${fail?'failed':done?'':'waiting'}">${icon(fail?'close':done?'check':i===step&&s==='running'?'refresh':'clock',i===step&&s==='running'?'spinner':'')}<span class="grow">${t(k)}</span><span class="small muted">${fail?t('failed'):done?t('completed'):t('waiting')}</span></div>`;}).join('')}</div><div class="info-box">${t(s==='resolved'?'passText':s==='failed'?(model.failureReason==='interrupted'?'interrupted':'failText'):'heroRunningDesc')}</div><div class="action-footer">${btn(t(s==='failed'?'decisionLog':'returnOverview'),s==='failed'?'nav-audit':'nav-overview','secondary','arrow')}</div><p class="gate-note">${t('caseRemaining')}</p></div></aside>`;}
function detailPage(){const c=dataCases().find(c=>c.id===ui.caseId)||dataCases()[0];return `<button class="breadcrumb-back" data-act="nav-cases">${icon('back')}${t('backCases')}</button><div class="page-head between case-detail-head"><div><div class="head-kicker mono">CASE-00${c.id} · ${c.cve}</div><h1 class="case-title">${c.name}</h1><p class="case-sub mono">${c.asset}</p></div>${badge(t('labOnly'),'gray','lock')}</div><div class="detail-status">${statusFor(c)}${c.id===1&&model.case1!=='resolved'?badge(t('confirmed'),'red'):''}${badge(c.priority==='pending'?t('unknownPriority'):c.priority,c.priority==='P0'?'red':'green')}${badge(t(c.confidence==='C0'?'c0':'c4'),c.confidence==='C4'?'amber':'green')}${c.id===1?badge('A2 · '+t('impact').split(' · ')[0],'gray'):''}</div><div class="detail-grid"><div class="detail-main"><div class="tabs" role="tablist" aria-label="${t('caseDetails')}">${[['assessment','assessment'],['evidence','evidence'],['trace','agentTrail']].map(v=>`<button role="tab" id="tab-${v[0]}" aria-selected="${ui.tab===v[0]}" aria-controls="case-tabpanel" tabindex="${ui.tab===v[0]?0:-1}" class="${ui.tab===v[0]?'active':''}" data-act="tab-${v[0]}">${t(v[1])}${v[0]==='evidence'?` <span class="muted">(${evidenceData[c.id].length})</span>`:''}</button>`).join('')}</div><div id="case-tabpanel" role="tabpanel" aria-labelledby="tab-${ui.tab}">${ui.tab==='evidence'?evidenceView(c.id):ui.tab==='trace'?traceView(c.id):assessmentView(c)}</div></div>${actionPanel(c)}</div>${footer()}`;}
function assetsPage(){return `<div class="page-head"><div class="head-kicker">${t('track')}</div><h1>${t('assetsTitle')}</h1><p>${t('assetsDesc')}</p></div><section class="asset-grid">${dataCases().map(c=>`<article class="card asset-card"><div class="between" style="align-items:flex-start"><span class="asset-icon">${icon('assets')}</span>${badge(t('labOnly'),'gray')}</div><h3 class="mono">${c.asset}</h3><p>${c.id===1?pair('Customer portal','客户门户'):c.id===2?pair('Order service','订单服务'):pair('Inventory API','库存 API')}</p><div class="asset-fields">${[[t('assetOwner'),t('securityTeam')],[t('assetEnvironment'),t('dockerLab')],[t('assetVersion'),c.id===1?(model.case1==='resolved'?pair('Patched image · demo','修补镜像 · 演示'):'Apache 2.4.49'):c.id===2?'Apache 2.4.51':pair('Unknown','未知')],[t('assetScope'),t('allowedLab')]].map(v=>`<div class="between"><span class="muted">${v[0]}</span><strong>${v[1]}</strong></div>`).join('')}</div>${statusFor(c)}<div style="margin-top:18px">${btn(t('caseDetails'),'case-'+c.id,'secondary','arrow')}</div></article>`).join('')}</section><div class="support-banner">${icon('lock')}<span>${t('assetNote')}</span></div>${footer()}`;}
function auditPage(){return `<div class="page-head between"><div><div class="head-kicker">${t('track')}</div><h1>${t('auditTitle')}</h1><p>${t('auditDesc')}</p></div>${btn(t('export'),'export','secondary','download')}</div><div class="card table-wrap"><table class="audit-table"><thead><tr><th>${t('timestamp')}</th><th>${t('event')}</th><th>${t('actor')}</th><th>${t('detail')}</th></tr></thead><tbody>${[...model.events].reverse().map((e,i)=>`<tr><td class="timestamp mono">${e.time}</td><td><span class="event">EVT-${String(model.events.length-i).padStart(3,'0')}</span><div style="font-size:11px;margin-top:4px">${t(e.key)}</div></td><td>${badge(t(e.actor),'gray')}</td><td><div class="log-detail">${escape(auditDetail(e))}</div></td></tr>`).join('')}</tbody></table></div><div class="support-banner">${icon('info')}<span>${t('auditNote')}</span></div>${footer()}`;}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title='TRACE — '+t('workspace');document.getElementById('app').innerHTML=sidebar()+`<div class="app-shell">${topbar()}<main class="content" id="main">${ui.page==='overview'?overview():ui.page==='cases'?casesPage():ui.page==='assets'?assetsPage():ui.page==='audit'?auditPage():detailPage()}</main></div>`+mobileNav();save();}
function navigate(page,id,tab){ui.page=page;if(id)ui.caseId=id;if(tab)ui.tab=tab;render();window.scrollTo({top:0,behavior:'instant'});}
function closeModal(){document.getElementById('modal').close();}
function modal(kind){if((kind==='approve'||kind==='reject')&&(ui.caseId!==1||model.case1!=='pending'))return;const d=document.getElementById('modal');let body='',foot='',title='';
 if(kind==='approve'){title=t('approvalTitle');body=`<p>${t('approvalBody')}</p><div class="modal-summary"><div class="between"><span>${t('action')}</span><strong>${t('patchTitle')}</strong></div><div class="between"><span>${t('asset')}</span><strong class="mono">customer-portal-prod-01</strong></div><div class="between"><span>${t('approvalScope')}</span><strong>${t('scopeOnly')}</strong></div></div><p>${t('impactText')}</p><p>${t('rollbackText')}</p><label class="check-label"><input id="approve-check" type="checkbox">${t('approvalCheck')}</label>`;foot=btn(t('cancel'),'modal-close','secondary')+btn(t('confirmApprove'),'confirm-approve','primary','check','id="approve-confirm" disabled');}
 else if(kind==='reject'){title=t('rejectTitle');body=`<p>${t('rejectBody')}</p><label class="field-label" for="reason" style="display:block;margin-top:18px">${t('reason')} <span class="required">*</span></label><textarea id="reason" maxlength="500" placeholder="${t('reasonPlaceholder')}" required></textarea>`;foot=btn(t('cancel'),'modal-close','secondary')+btn(t('confirmReject'),'confirm-reject','danger-btn','','id="reject-confirm" disabled');}
 else{title=t('noteTitle');body=`<p>${t('noteBody')}</p><label class="field-label" for="reason" style="display:block;margin-top:18px">${t('noteLabel')}</label><textarea id="reason" maxlength="500" placeholder="${t('notePlaceholder')}"></textarea>`;foot=btn(t('cancel'),'modal-close','secondary')+btn(t('saveNote'),'confirm-note','primary','','id="note-confirm" disabled');}
 d.innerHTML=`<div class="modal-head between"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-act="modal-close" aria-label="${t('cancel')}">${icon('close')}</button></div><div class="modal-body">${body}</div><div class="modal-footer">${foot}</div>`;d.showModal();}
function startExecution(){if(model.case1!=='pending'||ui.caseId!==1||!document.getElementById('approve-check')?.checked)return;closeModal();event('auditApproved','human','CASE-001 · approved A2 action for customer-portal-prod-01 · scope: this proposed lab image change only');model.case1='running';model.failureReason='';model.step=0;const outcome=model.verificationMode;render();toast('approvedToast');clearTimeout(runTimer);function tick(){if(model.case1!=='running')return;model.step++;if(model.step===1)event('auditExecution','agent','CASE-001 · simulated predefined lab image replacement; previous image/configuration retained');else if(model.step===3&&outcome==='fail'){model.case1='failed';event('auditFailure','verifier','CASE-001 · vulnerability re-check FAILED · stop; require human review and recovery');render();return;}else event('auditVerify','verifier','CASE-001 · '+['','', 'patched version PASS','vulnerability re-check PASS','service health PASS'][model.step]);if(model.step===4){model.case1='resolved';event('auditResolved','verifier','CASE-001 · all required lab checks passed · RESOLVED; other cases unchanged');}render();if(model.case1==='running')runTimer=setTimeout(tick,1100);}runTimer=setTimeout(tick,900);}
function rejectAction(){if(model.case1!=='pending'||ui.caseId!==1)return;const reason=document.getElementById('reason')?.value.trim();if(!reason)return;model.rejectReason=reason;model.case1='rejected';event('auditRejected','human','CASE-001 · '+reason+' · no execution allowed');closeModal();render();toast('rejectedToast');}
function resetDemo(){clearTimeout(runTimer);model=initialModel();ui.page='overview';ui.caseId=1;ui.tab='assessment';ui.filter='all';ui.search='';render();toast('resetToast');}
function exportAudit(){const blob=new Blob([JSON.stringify({prototype:'TRACE UI demo',simulation:true,caseStates:dataCases(),events:model.events},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TRACE_Demo_Audit.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('exportToast');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act;if(act.startsWith('nav-'))navigate(act.slice(4));else if(act.startsWith('case-'))navigate('detail',Number(act.slice(5)),'assessment');else if(act.startsWith('evidence-'))navigate('detail',Number(act.slice(9)),'evidence');else if(act.startsWith('trace-'))navigate('detail',Number(act.slice(6)),'trace');else if(act.startsWith('tab-')){ui.tab=act.slice(4);render();document.getElementById('tab-'+ui.tab)?.focus();}else if(act.startsWith('filter-')){ui.filter=act.slice(7);render();}else if(act==='demo-toggle'){ui.demoOpen=!ui.demoOpen;render();}else if(act==='approve-modal')modal('approve');else if(act==='reject-modal')modal('reject');else if(act==='note-modal')modal('note');else if(act==='modal-close')closeModal();else if(act==='confirm-approve')startExecution();else if(act==='confirm-reject')rejectAction();else if(act==='confirm-note'){const note=document.getElementById('reason').value.trim();if(!note)return;model.notes.push(note);event('auditNoteAdded','human','CASE-003 · '+note);closeModal();render();toast('noteToast');}else if(act==='new-review'&&model.case1==='rejected'){model.case1='pending';event('auditReopened','human','CASE-001 · new review requested; prior rejection retained; no action executed');render();toast('newReviewToast');}else if(act==='reset')resetDemo();else if(act==='export')exportAudit();});
document.addEventListener('input',e=>{if(e.target.id==='case-search'){const cursor=e.target.selectionStart;ui.search=e.target.value;render();const field=document.getElementById('case-search');field.focus();field.setSelectionRange(cursor,cursor);}else if(e.target.id==='reason'){const ok=!!e.target.value.trim();const b=document.getElementById('reject-confirm')||document.getElementById('note-confirm');if(b)b.disabled=!ok;}});
document.addEventListener('change',e=>{if(e.target.id==='language-select'&&['en','ms','zh'].includes(e.target.value)){lang=e.target.value;render();document.getElementById('language-select')?.focus();}if(e.target.id==='approve-check')document.getElementById('approve-confirm').disabled=!e.target.checked;if(e.target.id==='verification-mode'){model.verificationMode=e.target.value==='fail'?'fail':'pass';save();}});
document.addEventListener('keydown',e=>{const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=['assessment','evidence','trace'],index=keys.indexOf(ui.tab);ui.tab=e.key==='Home'?keys[0]:e.key==='End'?keys[2]:keys[(index+(e.key==='ArrowRight'?1:2))%3];render();document.getElementById('tab-'+ui.tab).focus();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
</script>
</body>
